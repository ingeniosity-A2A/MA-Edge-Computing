[package]
name = "exo-gate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
