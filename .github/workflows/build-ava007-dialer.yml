name: Build Ava007 Dialer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/Ava007-Dialer/**"
      - ".github/workflows/build-ava007-dialer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Ava007-Dialer
    steps:
      - name: Checkout MEC repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ava007-Dialer-debug-apk
          path: apps/Ava007-Dialer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
